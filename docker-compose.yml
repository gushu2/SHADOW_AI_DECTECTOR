version: '3.8'

services:
  # PostgreSQL 16 database for PHANTOM AI persistence
  postgres:
    image: postgres:16-alpine
    container_name: phantom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-phantom_ai}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phantom} -d ${POSTGRES_DB:-phantom_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - phantom-network

  # PHANTOM AI FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phantom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-phantom}:${POSTGRES_PASSWORD:-phantom_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-phantom_ai}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-phantom}:${POSTGRES_PASSWORD:-phantom_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-phantom_ai}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,https://ais-dev-z72qndg3fgf7yp6cne4lrg-437614388460.asia-southeast1.run.app,https://ais-pre-z72qndg3fgf7yp6cne4lrg-437614388460.asia-southeast1.run.app}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Zeek live ingestion is explicitly disabled by default for security
      ZEEK_LIVE_INGESTION_ENABLED: "false"
      TEMP_UPLOAD_DIR: "/tmp/phantom_uploads"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - phantom-network

volumes:
  postgres_data:
    driver: local

networks:
  phantom-network:
    driver: bridge
